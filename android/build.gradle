buildscript {
    configurations.classpath {
        resolutionStrategy.activateDependencyLocking()
    }
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 26
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        maven {
            url("$rootDir/../node_modules/detox/Detox-android")
        }
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    dependencyLocking {
        lockAllConfigurations()
    }
}

tasks.register("resolveAndLockAll") {
    group = "help"
    description = "Resolves all lockable Android project configurations so gradle.lockfile files can be written with --write-locks."

    doLast {
        allprojects.each { project ->
            project.buildscript.configurations.findAll { it.canBeResolved }.each { configuration ->
                configuration.incoming.resolutionResult.allComponents { }
            }

            project.configurations.findAll { it.canBeResolved }.each { configuration ->
                configuration.incoming.resolutionResult.allComponents { }
            }
        }
    }
}
